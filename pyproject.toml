[project]
name = "photophone"
version = "0.1.0"
description = "Turn any file into FLAC audio and get it back exactly"
requires-python = ">=3.10"
dependencies = ["flask", "numpy", "pillow", "pillow-jxl-plugin", "soundfile>=0.13", "waitress"]

[project.scripts]
photophone = "photophone:main"
photophone-web = "web:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["photophone.py", "web.py", "static/**"]
